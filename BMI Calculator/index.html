<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health BMI Calculator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      
      /* Category Colors */
      --underweight: #38bdf8;  /* Cyan */
      --normal: #22c55e;       /* Green */
      --overweight: #f59e0b;   /* Amber */
      --obese: #ef4444;        /* Red */
      
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 0.25rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.45rem;
    }

    .label-row label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .input-wrap {
      display: flex;
      align-items: center;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .input-wrap:focus-within {
      border-color: #38bdf8;
    }

    input[type="number"] {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 600;
      padding: 0.75rem 0.85rem;
      outline: none;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .input-unit {
      padding-right: 0.85rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      user-select: none;
    }

    input[type="range"] {
      width: 100%;
      margin-top: 0.5rem;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    .btn-calc {
      width: 100%;
      background: #38bdf8;
      color: #0b1329;
      border: none;
      border-radius: 10px;
      padding: 0.8rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 0.25rem;
    }

    .btn-calc:hover {
      background: #0ea5e9;
    }

    /* Result Display */
    .result-box {
      margin-top: 1.25rem;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: center;
    }

    .result-subtitle {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .bmi-value {
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 0.5rem;
      transition: color 0.3s ease;
    }

    .category-badge {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      transition: all 0.3s ease;
      margin-bottom: 1rem;
    }

    /* Visual Spectrum Gauge */
    .scale-wrapper {
      position: relative;
      margin: 1.25rem 0 0.5rem 0;
    }

    .spectrum-bar {
      display: flex;
      height: 10px;
      border-radius: 9999px;
      overflow: hidden;
      width: 100%;
    }

    .seg { height: 100%; }
    .seg-under { width: 18.5%; background: var(--underweight); }
    .seg-normal { width: 25%; background: var(--normal); }
    .seg-over { width: 25%; background: var(--overweight); }
    .seg-obese { width: 31.5%; background: var(--obese); }

    .needle {
      position: absolute;
      top: -6px;
      width: 4px;
      height: 22px;
      background: #ffffff;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
      transform: translateX(-50%);
      transition: left 0.3s ease;
      left: 0%;
    }

    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }

    /* Ideal Weight Footnote */
    .healthy-range {
      margin-top: 0.9rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border);
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .healthy-range strong {
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Health BMI Calculator</h1>
      <p>Calculate your Body Mass Index and identify healthy weight ranges.</p>
    </header>

    <div class="card">
      <!-- Height Input -->
      <div class="form-group">
        <div class="label-row">
          <label for="height-input">Height</label>
          <span id="height-label" style="font-size:0.85rem; font-weight:600; color:var(--text-muted);">170 cm</span>
        </div>
        <div class="input-wrap">
          <input type="number" id="height-input" min="90" max="250" value="170" placeholder="e.g. 170">
          <span class="input-unit">cm</span>
        </div>
        <input type="range" id="height-slider" min="90" max="230" value="170">
      </div>

      <!-- Weight Input -->
      <div class="form-group">
        <div class="label-row">
          <label for="weight-input">Weight</label>
          <span id="weight-label" style="font-size:0.85rem; font-weight:600; color:var(--text-muted);">65 kg</span>
        </div>
        <div class="input-wrap">
          <input type="number" id="weight-input" min="20" max="250" value="65" placeholder="e.g. 65">
          <span class="input-unit">kg</span>
        </div>
        <input type="range" id="weight-slider" min="30" max="180" value="65">
      </div>

      <button class="btn-calc" type="button" onclick="calculateBMI()">Calculate BMI</button>

      <!-- Results Display -->
      <div class="result-box">
        <div class="result-subtitle">Your Body Mass Index</div>
        <div class="bmi-value" id="bmi-display">22.5</div>
        <div class="category-badge" id="category-badge">Normal Weight</div>

        <!-- Spectrum Visual Gauge -->
        <div class="scale-wrapper">
          <div class="spectrum-bar">
            <div class="seg seg-under" title="Underweight (&lt; 18.5)"></div>
            <div class="seg seg-normal" title="Normal (18.5 - 24.9)"></div>
            <div class="seg seg-over" title="Overweight (25 - 29.9)"></div>
            <div class="seg seg-obese" title="Obese (≥ 30)"></div>
          </div>
          <div class="needle" id="needle"></div>
        </div>

        <div class="scale-labels">
          <span>Under (&lt;18.5)</span>
          <span>Normal (18.5-24.9)</span>
          <span>Over (25-29.9)</span>
          <span>Obese (≥30)</span>
        </div>

        <!-- Normal Range Estimation -->
        <div class="healthy-range" id="healthy-range">
          Ideal weight for your height: <strong id="ideal-weight-span">53.5 - 72.0 kg</strong>
        </div>
      </div>
    </div>
  </div>

  <script>
    // DOM Elements
    const heightInput = document.getElementById('height-input');
    const heightSlider = document.getElementById('height-slider');
    const heightLabel = document.getElementById('height-label');

    const weightInput = document.getElementById('weight-input');
    const weightSlider = document.getElementById('weight-slider');
    const weightLabel = document.getElementById('weight-label');

    const bmiDisplay = document.getElementById('bmi-display');
    const categoryBadge = document.getElementById('category-badge');
    const needle = document.getElementById('needle');
    const idealWeightSpan = document.getElementById('ideal-weight-span');

    // Two-way synchronization helper for inputs & sliders
    function sync(input, slider, label, unit) {
      input.addEventListener('input', () => {
        slider.value = input.value;
        label.textContent = `${input.value || 0} ${unit}`;
        calculateBMI();
      });
      slider.addEventListener('input', () => {
        input.value = slider.value;
        label.textContent = `${slider.value} ${unit}`;
        calculateBMI();
      });
    }

    sync(heightInput, heightSlider, heightLabel, 'cm');
    sync(weightInput, weightSlider, weightLabel, 'kg');

    // Main calculation logic
    function calculateBMI() {
      const heightCm = parseFloat(heightInput.value);
      const weightKg = parseFloat(weightInput.value);

      // Validate inputs
      if (!heightCm || !weightKg || heightCm <= 0 || weightKg <= 0) {
        bmiDisplay.textContent = "--";
        bmiDisplay.style.color = "var(--text-muted)";
        categoryBadge.textContent = "Please enter valid values";
        categoryBadge.style.backgroundColor = "transparent";
        categoryBadge.style.color = "var(--text-muted)";
        needle.style.left = "0%";
        idealWeightSpan.textContent = "--";
        return;
      }

      // Formula: BMI = weight (kg) / [height (m)]^2
      const heightM = heightCm / 100;
      const bmi = weightKg / (heightM * heightM);
      const roundedBMI = bmi.toFixed(1);

      bmiDisplay.textContent = roundedBMI;

      // Conditional Logic for WHO BMI categories and colors
      let category = "";
      let color = "";
      let badgeBg = "";

      if (bmi < 18.5) {
        category = "Underweight";
        color = "#38bdf8";            // Cyan
        badgeBg = "rgba(56, 189, 248, 0.15)";
      } else if (bmi >= 18.5 && bmi <= 24.9) {
        category = "Normal Weight";
        color = "#22c55e";            // Green
        badgeBg = "rgba(34, 197, 94, 0.15)";
      } else if (bmi >= 25 && bmi <= 29.9) {
        category = "Overweight";
        color = "#f59e0b";            // Amber
        badgeBg = "rgba(245, 158, 11, 0.15)";
      } else {
        category = "Obese";
        color = "#ef4444";            // Red
        badgeBg = "rgba(239, 68, 68, 0.15)";
      }

      // Update badge and text styling
      bmiDisplay.style.color = color;
      categoryBadge.textContent = category;
      categoryBadge.style.color = color;
      categoryBadge.style.backgroundColor = badgeBg;
      categoryBadge.style.border = `1px solid ${color}`;

      // Update Gauge Needle position (Scale mapped between BMI 10 and 40)
      const minScale = 10;
      const maxScale = 40;
      const clampedBMI = Math.min(Math.max(bmi, minScale), maxScale);
      const percentage = ((clampedBMI - minScale) / (maxScale - minScale)) * 100;
      needle.style.left = `${percentage}%`;

      // Calculate WHO Normal Weight boundaries (BMI 18.5 - 24.9)
      const minIdealKg = (18.5 * (heightM * heightM)).toFixed(1);
      const maxIdealKg = (24.9 * (heightM * heightM)).toFixed(1);
      idealWeightSpan.textContent = `${minIdealKg} - ${maxIdealKg} kg`;
    }

    // Run initial calculation on load
    calculateBMI();
  </script>
</body>
</html>
